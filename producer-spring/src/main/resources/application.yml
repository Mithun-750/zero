spring:
  application:
    name: producer-spring
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:order_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
      connection-timeout: 10000
      data-source-properties:
        stringtype: unspecified
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
    producer:
      client-id: ${KAFKA_CLIENT_ID:order-outbox-relay}
      acks: all
      retries: 2147483647
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    org.apache.kafka: WARN

app:
  outbox:
    # `once` is not set here: it comes from the CLI (--once) as a default property.
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    poll-interval: ${OUTBOX_POLL_INTERVAL_SECONDS:2}s
    orders-topic: ${KAFKA_ORDERS_TOPIC:orders.created}
